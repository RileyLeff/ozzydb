# Production Docker Compose
# PostgreSQL + Caddy reverse proxy + ozzy-server
#
# Usage:
#   cp .env.prod.example .env.prod
#   # Edit .env.prod with real values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: ozzy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ozzy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-ozzy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ozzy} -d ${POSTGRES_DB:-ozzy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed externally - only accessible to server

  server:
    build:
      context: ../../..
      dockerfile: crates/ozzy-server/docker/Dockerfile
    container_name: ozzy-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIND_ADDRESS: "0.0.0.0:3000"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ozzy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ozzy}"
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID required}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET required}
      BASE_URL: ${BASE_URL:?BASE_URL required}
      TMPDIR: /opt/ozzy/tmp
      # R2/S3 storage (required)
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT required}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY required}
      R2_REGION: ${R2_REGION:-auto}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-104857600}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Docker compute provider
      DOCKER_COMPUTE_ENABLED: ${DOCKER_COMPUTE_ENABLED:-true}
      DOCKER_COMPUTE_RUNTIME: ${DOCKER_COMPUTE_RUNTIME:-runsc}
      DOCKER_COMPUTE_MEMORY_LIMIT: ${DOCKER_COMPUTE_MEMORY_LIMIT:-2g}
      DOCKER_COMPUTE_CPU_LIMIT: ${DOCKER_COMPUTE_CPU_LIMIT:-1}
      # Global compute settings
      COMPUTE_TIMEOUT_SECS: ${COMPUTE_TIMEOUT_SECS:-300}
      COMPUTE_DEFAULT_PROVIDER: ${COMPUTE_DEFAULT_PROVIDER:-}
      ALLOWED_LOGINS: ${ALLOWED_LOGINS:-}
      # GitHub App (optional — enables private repo access via push)
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Secrets encryption (hex-encoded 32-byte key; required for project secrets)
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      # Fly Machines compute backend (optional — enables remote compute)
      FLY_API_TOKEN: ${FLY_API_TOKEN:-}
      FLY_APP_NAME: ${FLY_APP_NAME:-}
      FLY_REGION: ${FLY_REGION:-}
      FLY_API_URL: ${FLY_API_URL:-}
      FLY_CPU_KIND: ${FLY_CPU_KIND:-}
      FLY_CPUS: ${FLY_CPUS:-}
      FLY_MEMORY_MB: ${FLY_MEMORY_MB:-}
      # Rate limiting (concurrent job limits; 0 = unlimited)
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-}
      RATE_LIMIT_PER_USER_MAX: ${RATE_LIMIT_PER_USER_MAX:-}
      RUST_LOG: ${RUST_LOG:-info,ozzy_server=debug}
    volumes:
      # Docker socket for server-side compute (transform execution)
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared tmpdir: must be a bind mount (not a volume) so compute
      # containers can access it via the host Docker daemon
      - /opt/ozzy/tmp:/opt/ozzy/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Not exposed externally - only accessible to Caddy

  caddy:
    image: caddy:2-alpine
    container_name: ozzy-caddy
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /opt/ozzydb/frontend:/srv/frontend:ro
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN required}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:?FRONTEND_DOMAIN required}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
