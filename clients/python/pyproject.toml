[project]
name = "ozzydb"
version = "0.2.0"
description = "Python client for OzzyDB - version control for data transformations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Riley Leff" }
]
keywords = ["data", "versioning", "reproducibility", "science", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ozzydb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pandas>=2.3.3",
]
