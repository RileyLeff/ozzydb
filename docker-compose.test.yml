# Test infrastructure: Postgres + MinIO for integration and E2E tests.
# Uses non-default ports to avoid conflicts with the dev stack.
#
# Usage:
#   just test-infra-up     # start services
#   just test-docker        # run integration tests
#   just test-e2e           # run E2E tests
#   just test-infra-down    # stop services

services:
  postgres:
    image: postgres:17-alpine
    container_name: ozzy-test-postgres
    environment:
      POSTGRES_USER: ozzy_test
      POSTGRES_PASSWORD: ozzy_test
      POSTGRES_DB: ozzy_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozzy_test"]
      interval: 3s
      timeout: 2s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ozzy-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 2s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: ozzy-test-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/ozzy-test;
        echo 'Bucket ozzy-test ready';
      "
