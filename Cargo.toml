[workspace]
resolver = "2"
members = [
    "crates/ozzy-core",
    "crates/ozzy-cli",
    "crates/ozzy-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rileyleff/ozzydb"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Hashing
blake3 = "1"

# Data formats
arrow = { version = "54", features = ["ipc", "json"] }
parquet = { version = "54", features = ["arrow", "zstd", "lz4"] }

# Local database for cache index
rusqlite = { version = "0.32", features = ["bundled"] }

# Error handling
anyhow = "1"
thiserror = "1"

# File system
walkdir = "2"
tempfile = "3"
dirs = "5"

# Platform detection
sysinfo = "0.32"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Process execution
which = "7"

# Object storage (S3, GCS, etc.)
object_store = { version = "0.11", features = ["aws"] }
async-trait = "0.1"
bytes = "1"
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Web framework (server)
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# PostgreSQL database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# OAuth
oauth2 = "5"

# HTTP client
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }

# Streaming utilities
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

# Tar archives
tar = "0.4"

# Random number generation
rand = "0.9"

# Base64 encoding
base64 = "0.22"

# Cryptography
aes-gcm = "0.10"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
ozzy-core = { path = "crates/ozzy-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
